    <text x="18" y="78"><tspan fill="#58A6FF">&gt;&gt;&gt; </tspan><tspan fill="#C9D1D9">import pandas as pd</tspan><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.4s" fill="freeze"/></text>
    <text x="18" y="100"><tspan fill="#58A6FF">&gt;&gt;&gt; </tspan><tspan fill="#C9D1D9">z = (x - μ) / σ</tspan><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.2s" fill="freeze"/></text>
    <text x="18" y="122"><tspan fill="#58A6FF">&gt;&gt;&gt; </tspan><tspan fill="#C9D1D9">model.fit(X, y)</tspan><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3s" fill="freeze"/></text>
    <text x="18" y="144" fill="#7EE787"><tspan fill="#58A6FF">r² = </tspan>0.98 · p &lt; 0.001<animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.8s" fill="freeze"/></text>
