      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="300" y="48" font-size="11" fill="#8B949E" font-family="DejaVu Sans, Arial, sans-serif">curva normal · z-scores</text>

